name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  draft-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check tag matches mygo.json version
        run: |
          version="$(grep -oE '"version":\s*"[^"]+"' mygo.json | head -n 1 | cut -d '"' -f 4)"
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME does not match mygo.json version v$version" >&2
            exit 1
          fi
      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" \
              --draft --verify-tag --title "$GITHUB_REF_NAME" --generate-notes
          fi

  build:
    needs: draft-release
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: macOS, os: macos-latest, platform: "darwin/arm64,darwin/amd64" }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Import macOS signing certificate and notary credentials
        if: runner.os == 'macOS'
        env:
          MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: |
          missing=()
          [ -z "$MACOS_CERTIFICATE" ] && missing+=(MACOS_CERTIFICATE)
          [ -z "$MACOS_CERTIFICATE_PASSWORD" ] && missing+=(MACOS_CERTIFICATE_PASSWORD)
          [ -z "$APPLE_ID" ] && missing+=(APPLE_ID)
          [ -z "$APPLE_TEAM_ID" ] && missing+=(APPLE_TEAM_ID)
          [ -z "$APPLE_APP_PASSWORD" ] && missing+=(APPLE_APP_PASSWORD)
          if [ "${#missing[@]}" -gt 0 ]; then
            echo "Missing required macOS signing/notarization secrets: ${missing[*]}" >&2
            exit 1
          fi

          keychain="$RUNNER_TEMP/signing.keychain-db"
          password="$(openssl rand -base64 24)"
          security create-keychain -p "$password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$password" "$keychain"

          p12="$RUNNER_TEMP/certificate.p12"
          echo "$MACOS_CERTIFICATE" | base64 --decode > "$p12"
          security import "$p12" -k "$keychain" \
            -P "$MACOS_CERTIFICATE_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          rm -f "$p12"

          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$password" "$keychain"
          security list-keychains -d user -s "$keychain" login.keychain

          identity="$(security find-identity -v -p codesigning "$keychain" | sed -n 's/.*"Developer ID Application: \([^"]*\)".*/Developer ID Application: \1/p' | head -n 1)"
          if [ -z "$identity" ]; then
            echo "No 'Developer ID Application' identity found in MACOS_CERTIFICATE" >&2
            security find-identity -v -p codesigning "$keychain" >&2 || true
            exit 1
          fi
          echo "Using signing identity: $identity"

          xcrun notarytool store-credentials notary \
            --keychain "$keychain" \
            --apple-id "$APPLE_ID" \
            --team-id "$APPLE_TEAM_ID" \
            --password "$APPLE_APP_PASSWORD"

          python3 - "$identity" "$keychain" <<'PY'
          import json, sys
          identity, keychain = sys.argv[1], sys.argv[2]
          with open("mygo.json", "r", encoding="utf-8") as f:
              cfg = json.load(f)
          macos = cfg.setdefault("macos", {})
          macos["signingIdentity"] = identity
          macos["notarize"] = {
              "keychainProfile": "notary",
              "keychain": keychain,
          }
          with open("mygo.json", "w", encoding="utf-8") as f:
              json.dump(cfg, f, indent=2)
              f.write("\n")
          PY
      - name: Build, sign, notarize, and upload updates
        env:
          CGO_ENABLED: "0"
          GH_TOKEN: ${{ github.token }}
          MYGO_UPDATER_PRIVATE_KEY: ${{ secrets.MYGO_UPDATER_PRIVATE_KEY }}
        run: go tool mygo build -platform "${{ matrix.platform }}" -upload
      - name: Clean up signing keychain
        if: always() && runner.os == 'macOS'
        run: rm -f "$RUNNER_TEMP/certificate.p12" "$RUNNER_TEMP/signing.keychain-db"

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [[ "$GITHUB_REF_NAME" == *-* ]]; then
            gh release edit "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --draft=false --prerelease --latest=false
          else
            gh release edit "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --draft=false --latest
          fi

  homebrew:
    needs: publish
    if: ${{ !contains(github.ref_name, '-') }}
    runs-on: ubuntu-latest
    steps:
      - name: Update Homebrew Cask in Lorpaves/homebrew-tap
        env:
          GH_TOKEN: ${{ github.token }}
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          if [ -z "$HOMEBREW_TAP_TOKEN" ]; then
            echo "HOMEBREW_TAP_TOKEN not set; skipping Homebrew tap update."
            exit 0
          fi
          version="${GITHUB_REF_NAME#v}"
          gh release download "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" -p SHA256SUMS -O SHA256SUMS
          arm_sha="$(awk -v f="flow-${version}-arm64.dmg" '$2 == f {print $1}' SHA256SUMS)"
          intel_sha="$(awk -v f="flow-${version}-amd64.dmg" '$2 == f {print $1}' SHA256SUMS)"
          if [ -z "$arm_sha" ] || [ -z "$intel_sha" ]; then
            echo "Missing DMG checksums in SHA256SUMS" >&2
            exit 1
          fi
          git clone "https://x-access-token:${HOMEBREW_TAP_TOKEN}@github.com/Lorpaves/homebrew-tap.git" tap
          cat > tap/Casks/flow.rb <<EOF
          cask "flow" do
            arch arm: "arm64", intel: "amd64"

            version "${version}"
            sha256 arm:   "${arm_sha}",
                   intel: "${intel_sha}"

            url "https://github.com/Lorpaves/flow/releases/download/v#{version}/flow-#{version}-#{arch}.dmg"
            name "Flow"
            desc "Personal offline project management app"
            homepage "https://github.com/Lorpaves/flow"

            livecheck do
              url :url
              strategy :github_latest
            end

            auto_updates true
            depends_on macos: ">= :monterey"

            app "Flow.app"

            zap trash: [
              "~/Library/Application Support/Flow",
              "~/Library/Caches/com.lorpaves.flow",
              "~/Library/Preferences/com.lorpaves.flow.plist",
            ]
          end
          EOF
          cd tap
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Casks/flow.rb
          if ! git diff --cached --quiet; then
            git commit -m "Update flow to ${version}"
            git push origin HEAD
          fi
